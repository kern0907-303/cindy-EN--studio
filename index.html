<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>白雲屋英文課｜AI 共學與生活連結工作台</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cloud: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              800: '#075985',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">

  <!-- 螢幕視角應用主體 (列印時隱藏) -->
  <div class="no-print flex-1 flex flex-col min-h-screen">
    
    <!-- 頂部通用導航欄 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-2xs">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button onclick="goHome()" aria-label="回到英文課首頁" title="回到首頁"
            class="w-10 h-10 rounded-2xl bg-sky-600 hover:bg-sky-700 text-white flex items-center justify-center font-black text-xl shadow-xs transition focus:outline-none focus:ring-2 focus:ring-sky-300">
            ☁️
          </button>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-black tracking-widest text-amber-600 uppercase">羽白群學 • 白雲屋</span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">Cindy 教室</span>
            </div>
            <h1 class="text-base sm:text-lg font-black text-slate-800 tracking-tight">英文課 AI 共學與生活連結工作台</h1>
          </div>
        </div>

        <!-- 頂部捷徑功能按鈕 -->
        <div class="flex items-center gap-2 sm:gap-3">
          <button onclick="showCustomParser()" 
            class="px-3 sm:px-4 py-2 bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-900 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-2xs">
            <span>✨</span>
            <span class="hidden sm:inline">學生自訂台詞/音樂解析</span>
            <span class="sm:hidden">自訂解析</span>
          </button>

          <button onclick="prepareAndPrintCurrentCourse()" 
            class="px-3 sm:px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-2xs">
            <span>🖨️</span>
            <span class="hidden sm:inline">一鍵列印手寫單</span>
            <span class="sm:hidden">列印學習單</span>
          </button>

          <button onclick="showAiVoiceSettings()"
            class="px-3 sm:px-4 py-2 bg-violet-50 hover:bg-violet-100 border border-violet-300 text-violet-900 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-2xs">
            <span>🔊</span>
            <span class="hidden sm:inline">AI 聲音</span>
            <span class="sm:hidden">聲音</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 行動版快速切換：不必開啟側欄即可直接選課或選學生 -->
    <nav class="lg:hidden bg-white border-b border-slate-200 px-4 py-3 grid grid-cols-2 gap-2" aria-label="快速課程與學習者切換">
      <div>
        <label for="mobile-course-select" class="block mb-1 text-[10px] font-black tracking-wider text-amber-700">選擇班別</label>
        <select id="mobile-course-select" onchange="selectCourse(this.value)" class="w-full rounded-xl border border-amber-200 bg-amber-50 px-2.5 py-2 text-xs font-bold text-slate-700">
          <!-- 由 app.js 動態填充 -->
        </select>
      </div>
      <div>
        <label for="mobile-student-select" class="block mb-1 text-[10px] font-black tracking-wider text-teal-700">選擇學習者</label>
        <select id="mobile-student-select" onchange="selectStudent(this.value)" class="w-full rounded-xl border border-teal-200 bg-teal-50 px-2.5 py-2 text-xs font-bold text-slate-700">
          <!-- 由 app.js 動態填充 -->
        </select>
      </div>
    </nav>

    <!-- 主版面佈局 (側邊欄 + 工作區) -->
    <div id="app-layout" class="flex-1 flex max-w-7xl w-full mx-auto">
      
      <!-- 左側邊欄：課表與學生切換 -->
      <aside id="course-controls-sidebar" class="w-72 bg-white border-r border-slate-200 hidden lg:flex flex-col shrink-0">
       
        <!-- 與右側課程資訊列同高的選單區 -->
        <div class="sidebar-selectors">
          <!-- 課表時段切換 (按時間順序) -->
          <div>
          <div class="flex items-center justify-between mb-2 px-1">
            <h2 class="text-xs font-black uppercase tracking-wider text-slate-400">📅 每週課表對應班別</h2>
            <span class="text-[10px] text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded font-bold">115上課表</span>
          </div>
          <label for="nav-course-select" class="sr-only">選擇課程班別</label>
          <select id="nav-course-select" onchange="selectCourse(this.value)"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm font-semibold text-slate-700 outline-none transition focus:border-amber-400 focus:ring-2 focus:ring-amber-100">
            <!-- 由 app.js 動態填充 -->
          </select>
          </div>

          <!-- 學生個人視角 -->
          <div>
          <div class="flex items-center justify-between mb-2 px-1">
            <h2 class="text-xs font-black uppercase tracking-wider text-slate-400">🧑‍🎓 學習者檔案與投其所好</h2>
          </div>
          <label for="nav-student-select" class="sr-only">選擇學習者檔案</label>
          <select id="nav-student-select" onchange="selectStudent(this.value)"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm font-semibold text-slate-700 outline-none transition focus:border-teal-400 focus:ring-2 focus:ring-teal-100">
            <!-- 由 app.js 動態填充 -->
          </select>
          </div>
        </div>

        <!-- 陪伴引導核心精神小看板 -->
        <div class="sidebar-philosophy m-4 mt-auto bg-amber-50/60 border border-amber-200/80 rounded-2xl p-3.5 text-xs text-amber-950">
          <div class="font-bold flex items-center gap-1 text-amber-900 mb-1">
            <span>🌱</span> 我們的陪伴精神
          </div>
          <p class="text-[11px] leading-relaxed text-amber-900/80">
            不塞繁瑣文法，以聽帶拼。從孩子熱愛的電影、音樂、短講長出安全感，一筆一劃手寫出自信！
          </p>
        </div>
      </aside>

      <!-- 右側主工作區 -->
      <main id="main-workspace" class="flex-1 overflow-y-auto">
        <!-- 由 app.js 根據狀態渲染 -->
      </main>

    </div>

    <!-- 底部資訊 -->
    <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-400">
      羽白群學 • 白雲屋 (Cindy 教室) ｜ 英語共學與生活連結應用 ｜ 雙導師陪伴模式
    </footer>

  </div>

  <!-- 列印專用隱藏區域 (列印時才顯示，自動排版成 A4) -->
  <div id="printable-area" class="print-only">
    <!-- 由列印按鈕動態注入 -->
  </div>

  <script src="app.js"></script>
</body>
</html>
